<!DOCTYPE html>
<html lang="el" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page(~{::title}, ~{::section})}">
<head><title>Προφίλ</title></head>
<body>
<section class="row g-4">
    <div class="col-12">
        <h1 class="h3" th:text="${user.fullName}">Όνομα</h1>
        <p class="text-muted" th:text="${user.role.label} + ' · ' + ${user.username}"></p>
    </div>
    <div class="col-12 col-md-6">
        <form th:action="@{/profile/contact}" th:object="${contact}" method="post" class="card card-body" novalidate>
            <h2 class="h5">Στοιχεία επικοινωνίας</h2>
            <div th:replace="~{fragments :: globalErrors}"></div>
            <div th:replace="~{fragments :: field('email', 'Email', 'email')}"></div>
            <div th:replace="~{fragments :: field('phone', 'Τηλέφωνο', 'tel')}"></div>
            <button class="btn btn-primary" type="submit">Αποθήκευση</button>
        </form>
    </div>
    <div class="col-12 col-md-6">
        <form th:action="@{/profile/password}" th:object="${password}" method="post" class="card card-body" novalidate>
            <h2 class="h5">Αλλαγή κωδικού</h2>
            <div th:replace="~{fragments :: globalErrors}"></div>
            <div th:replace="~{fragments :: field('currentPassword', 'Τρέχων κωδικός', 'password')}"></div>
            <div th:replace="~{fragments :: field('newPassword', 'Νέος κωδικός (≥ 8)', 'password')}"></div>
            <button class="btn btn-primary" type="submit">Αλλαγή</button>
        </form>
    </div>
</section>
</body>
</html>
