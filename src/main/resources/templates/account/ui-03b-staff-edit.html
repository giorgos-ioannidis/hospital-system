<!DOCTYPE html>
<html lang="el" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page(~{::title}, ~{::section})}">
<head><title>Επεξεργασία λογαριασμού</title></head>
<body>
<section class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
        <h1 class="h3" th:text="${account.fullName}">Όνομα</h1>
        <p class="text-muted" th:text="${account.role.label} + ' · ' + ${account.username}"></p>
        <form th:action="@{/staff/{id}(id=${account.id})}" th:object="${form}" method="post" class="card card-body" novalidate>
            <div th:replace="~{fragments :: globalErrors}"></div>
            <div th:replace="~{fragments :: field('email', 'Email', 'email')}"></div>
            <div th:replace="~{fragments :: field('phone', 'Τηλέφωνο', 'tel')}"></div>
            <div class="mb-3">
                <label class="form-label" for="departmentId">Τμήμα</label>
                <select class="form-select" id="departmentId" th:field="*{departmentId}">
                    <option th:each="d : ${departments}" th:value="${d.id}" th:text="${d.name}"></option>
                </select>
            </div>
            <div class="mb-3" th:if="${account.role.name() != 'SUPERVISOR'}">
                <label class="form-label" for="specialtyId">Ειδικότητα</label>
                <select class="form-select" id="specialtyId" th:field="*{specialtyId}">
                    <option th:each="s : ${specialties}" th:value="${s.id}" th:text="${s.name}"></option>
                </select>
            </div>
            <div class="d-flex gap-2">
                <button class="btn btn-primary" type="submit">Αποθήκευση</button>
                <a class="btn btn-outline-secondary" th:href="@{/staff}">Πίσω</a>
            </div>
        </form>
    </div>
</section>
</body>
</html>
