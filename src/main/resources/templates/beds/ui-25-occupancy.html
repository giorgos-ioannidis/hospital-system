<!DOCTYPE html>
<html lang="el" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page(~{::title}, ~{::section})}">
<head><title>Πληρότητα θαλάμων</title></head>
<body>
<section>
    <h1 class="h3 mb-1">Πληρότητα θαλάμων</h1>
    <p class="small text-muted">Σε κόκκινο οι θάλαμοι με πληρότητα πάνω από 90%.</p>
    <div class="row g-3">
        <div class="col-12 col-md-6 col-xl-4" th:each="d : ${occupancy}">
            <div class="card h-100">
                <div class="card-header fw-semibold" th:text="${d.key.name}"></div>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item" th:each="w : ${d.value}" th:classappend="${w.alert} ? 'list-group-item-danger'">
                        <div class="d-flex justify-content-between">
                            <span th:text="${w.ward.name}"></span>
                            <span th:text="${w.occupied} + '/' + ${w.beds} + ' · ' + ${w.percent} + '%'"></span>
                        </div>
                        <div class="progress mt-1" role="progressbar" th:attr="aria-valuenow=${w.percent},aria-label=${w.ward.name}"
                             aria-valuemin="0" aria-valuemax="100" style="height: 6px">
                            <div class="progress-bar" th:classappend="${w.alert} ? 'bg-danger'" th:style="'width: ' + ${w.percent} + '%'"></div>
                        </div>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</section>
</body>
</html>
