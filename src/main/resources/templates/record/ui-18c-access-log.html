<!DOCTYPE html>
<html lang="el" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page(~{::title}, ~{::section})}">
<head><title>Πρόσβαση στον φάκελό μου</title></head>
<body>
<section>
    <h1 class="h3">Ποιος είδε τον φάκελό μου</h1>
    <p class="small text-muted">Κάθε πρόσβαση και κάθε απόπειρα πρόσβασης καταγράφεται (GDPR).</p>
    <table class="table table-hover small">
        <thead><tr><th>Πότε</th><th>Χρήστης</th><th>Ενέργεια</th><th>Αποτέλεσμα</th></tr></thead>
        <tbody>
        <tr th:each="l : ${logs}" th:classappend="${!l.allowed} ? 'table-danger'">
            <td th:text="${#temporals.format(l.occurredAt, 'dd/MM/yyyy HH:mm')}"></td>
            <td th:text="${l.user.fullName} + ' (' + ${l.user.role.label} + ')'"></td>
            <td th:text="${l.action.label}"></td>
            <td th:text="${l.allowed} ? 'Επιτράπηκε' : 'Απορρίφθηκε'"></td>
        </tr>
        </tbody>
    </table>
    <a class="btn btn-outline-secondary" th:href="@{/records/mine}">Πίσω στον φάκελο</a>
</section>
</body>
</html>
