<!DOCTYPE html>
<html lang="el" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page(~{::title}, ~{::section})}">
<head><title>Τα ραντεβού μου · Γενικό Νοσοκομείο</title></head>
<body>
<section th:with="upcoming=${appointments.?[active and status.name() != 'COMPLETED' and end.isAfter(#vars.now)]},
                  past=${appointments.?[!(active and status.name() != 'COMPLETED' and end.isAfter(#vars.now))]}">
    <header class="page-head">
        <div>
            <h1>Τα ραντεβού μου</h1>
            <p class="text-muted mb-0">Αλλαγή ή ακύρωση επιτρέπεται έως 24 ώρες πριν από το ραντεβού.</p>
        </div>
        <div class="page-actions">
            <a class="btn btn-outline-secondary" th:href="@{/export/appointments}"><i class="bi bi-filetype-pdf" aria-hidden="true"></i> PDF</a>
            <a class="btn btn-primary" th:href="@{/appointments/new}"><i class="bi bi-calendar-plus" aria-hidden="true"></i> Νέο ραντεβού</a>
        </div>
    </header>

    <div class="empty-state" th:if="${#lists.isEmpty(appointments)}">
        <i class="bi bi-calendar" aria-hidden="true"></i>
        <span>Δεν έχετε ραντεβού ακόμη.</span>
    </div>

    <th:block th:each="group : ${ {'Επόμενα', 'Προηγούμενα και ακυρωμένα'} }"
              th:with="list=${group == 'Επόμενα'} ? ${upcoming} : ${past}">
        <th:block th:unless="${#lists.isEmpty(list)}">
            <h2 class="h5 mt-4 mb-2" th:text="${group}">Επόμενα</h2>
            <div class="table-responsive">
                <table class="table table-stack table-hover align-middle">
                    <thead><tr><th>Ημέρα και ώρα</th><th>Υπηρεσία</th><th>Ιατρός</th><th>Αίθουσα</th><th>Κωδικός</th><th>Κατάσταση</th><th>Πληρωμή</th><th>Ενέργειες</th></tr></thead>
                    <tbody>
                    <tr th:each="a : ${list}" th:with="changeable=${a.status.changeable and a.start.isAfter(deadline)}">
                        <td data-label="Ημέρα και ώρα"><strong th:text="${#temporals.format(a.start, 'EEE dd/MM/yyyy HH:mm')}"></strong></td>
                        <td data-label="Υπηρεσία" th:text="${a.service.name}"></td>
                        <td data-label="Ιατρός" th:text="${a.doctor.fullName}"></td>
                        <td data-label="Αίθουσα"><a th:href="@{/info/map(room=${a.room.id})}" th:text="${a.room.name}" title="Δείτε στον χάρτη"></a></td>
                        <td data-label="Κωδικός" class="font-monospace" th:text="${a.code}"></td>
                        <td data-label="Κατάσταση">
                            <span class="badge" th:text="${a.status.label}"
                                  th:classappend="${a.status.name() == 'CANCELLED'} ? 'text-bg-danger' : (${a.status.name() == 'COMPLETED'} ? 'text-bg-success' : 'text-bg-light border')"></span>
                        </td>
                        <td data-label="Πληρωμή" th:text="${a.payment == null} ? '—' : (${a.payment.status.name() == 'PAID'} ? 'Πληρώθηκε (' + ${a.payment.transactionRef} + ')' : 'Στο ταμείο')"></td>
                        <td data-label="Ενέργειες">
                            <div class="d-flex flex-wrap gap-1" th:if="${changeable}">
                                <a class="btn btn-sm btn-outline-primary" th:href="@{/appointments/{id}/reschedule(id=${a.id})}">Αλλαγή ώρας</a>
                                <form th:action="@{/appointments/{id}/cancel(id=${a.id})}" method="post"
                                      onsubmit="return confirm('Να ακυρωθεί το ραντεβού;');">
                                    <button class="btn btn-sm btn-outline-danger" type="submit">Ακύρωση</button>
                                </form>
                            </div>
                            <span class="small text-muted" th:if="${a.status.changeable and !changeable}">Απομένουν λιγότερες από 24 ώρες</span>
                            <span th:if="${a.rating != null}" th:text="'★ ' + ${a.rating.stars} + '/5'"></span>
                            <form th:if="${a.status.name() == 'COMPLETED' and a.rating == null}" th:action="@{/appointments/{id}/rating(id=${a.id})}"
                                  method="post" class="d-flex flex-wrap gap-1">
                                <label class="visually-hidden" th:for="'r-' + ${a.id}">Αξιολόγηση</label>
                                <select class="form-select form-select-sm w-auto" name="stars" th:id="'r-' + ${a.id}">
                                    <option th:each="n : ${#numbers.sequence(5, 1, -1)}" th:value="${n}" th:text="${n} + ' ★'"></option>
                                </select>
                                <label class="visually-hidden" th:for="'c-' + ${a.id}">Σχόλιο</label>
                                <input class="form-control form-control-sm w-auto" name="comment" th:id="'c-' + ${a.id}" placeholder="Σχόλιο" maxlength="500">
                                <button class="btn btn-sm btn-outline-primary" type="submit">Αξιολόγηση</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </th:block>
    </th:block>
</section>
</body>
</html>
