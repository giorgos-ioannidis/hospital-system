<!DOCTYPE html>
<html lang="el" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page(~{::title}, ~{::section})}">
<head><title>Παραγωγή προγράμματος</title></head>
<body>
<section class="row g-4">
    <div class="col-12 col-lg-5">
        <h1 class="h3">Παραγωγή μηνιαίου προγράμματος</h1>
        <form th:action="@{/schedules}" th:object="${form}" method="post" class="card card-body" novalidate>
            <div class="mb-3">
                <label class="form-label" for="departmentId">Τμήμα</label>
                <select class="form-select" id="departmentId" th:field="*{departmentId}">
                    <option th:each="d : ${departments}" th:value="${d.id}" th:text="${d.name}"></option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label" for="month">Μήνας</label>
                <input class="form-control" id="month" type="month" name="month"
                       th:value="${form.month}" th:classappend="${#fields.hasErrors('month')} ? 'is-invalid'" required>
                <div class="invalid-feedback" th:errors="*{month}"></div>
            </div>
            <div th:replace="~{fragments :: field('maxWeeklyHours', 'Μέγιστες ώρες ανά εβδομάδα', 'number')}"></div>
            <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" id="fair" th:field="*{fair}">
                <label class="form-check-label" for="fair">Δίκαιη στρατηγική (πρώτα Σ/Κ, αργίες, εφημερίες)</label>
            </div>
            <p class="small text-muted">Η ελάχιστη στελέχωση ανά βάρδια και ειδικότητα λαμβάνεται από τις ρυθμίσεις του τμήματος.
                Οι εγκεκριμένες άδειες και οι απουσίες λαμβάνονται υπόψη αυτόματα.</p>
            <button class="btn btn-primary" type="submit">Παραγωγή προγράμματος</button>
        </form>
    </div>
    <div class="col-12 col-lg-7">
        <h2 class="h5">Υπάρχοντα προγράμματα</h2>
        <p class="text-muted" th:if="${#lists.isEmpty(schedules)}">Δεν υπάρχει ακόμη πρόγραμμα.</p>
        <div class="list-group">
            <a class="list-group-item list-group-item-action d-flex justify-content-between align-items-center"
               th:each="s : ${schedules}" th:href="@{/schedules/{id}(id=${s.id})}">
                <span th:text="${s.department.name} + ' · ' + ${#temporals.format(s.periodStart, 'LLLL yyyy')}"></span>
                <span class="badge" th:classappend="${s.draft} ? 'text-bg-warning' : 'text-bg-success'"
                      th:text="${s.draft} ? 'Πρόχειρο' : 'Ενεργό'"></span>
            </a>
        </div>
    </div>
</section>
</body>
</html>
